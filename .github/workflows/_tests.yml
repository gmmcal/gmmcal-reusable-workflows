name: Backend Tests

on:
  workflow_call:
    inputs:
      ruby-version:
        type: string
        required: false
        default: "3.4"
      migration-command:
        type: string
        required: false
        default: bundle exec rails db:migrate
      command:
        type: string
        required: true

      database-name:
        type: string
        required: true

jobs:
  tests:
    name: Backend
    runs-on: ubuntu-26.04
    env:
      DATABASE_URL: postgres://database-user:database-password@localhost:5432/${{ inputs.database-name }}
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: true
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: database-user
          POSTGRES_PASSWORD: database-password
          POSTGRES_DB: ${{ inputs.database-name }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Migrate database
        run: ${{ inputs.migration-command }}

      - name: Execute tests
        run: ${{ inputs.command }}
