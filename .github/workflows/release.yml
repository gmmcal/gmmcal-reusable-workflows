name: Tag Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.next }}
      major: ${{ steps.semver.outputs.nextMajor }}
    steps:
      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          majorList: "BREAK"
          minorList: "NEW"
          patchList: "FIX,OPT"

      - name: 🏷️ Create tag ${{ steps.semver.outputs.next }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.semver.outputs.next }}',
              sha: context.sha
            })

      - name: 🏷️ Create/update tag ${{ steps.semver.outputs.nextMajor }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.semver.outputs.nextMajor }}',
              sha: context.payload.after
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.semver.outputs.nextMajor }}',
                sha: context.payload.after
              });
            })

  release:
    name: Release
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_release.yml@v1
    needs:
      - tag
    with:
      tag: ${{ needs.tag.outputs.version }}
      reference: ${{ github.sha }}
